<head>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: manipulation;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(#58c8e8, #b9f2ff);
}

#menu h1 {
    font-size: clamp(40px, 9vw, 80px);
    color: white;
    text-shadow: 4px 4px #333;
    margin-bottom: 10px;
}

#menu p {
    color: #333;
    font-weight: bold;
    margin-bottom: 15px;
}

#skins {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 900px;
    padding: 10px;
}

.skin {
    border: 3px solid white;
    border-radius: 12px;
    background: #222;
    color: white;
    padding: 10px 14px;
    font-size: 18px;
}

.skin.locked {
    opacity: 0.45;
}

.skin.selected {
    border-color: #ffe600;
    box-shadow: 0 0 12px #ffe600;
}
