<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>SKY BIRD</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#70c5ce;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   TELA DEITADA
========================= */

#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font:bold 25px Arial;
    padding:30px;
}

@media (orientation:portrait){

    #rotate{
        display:flex;
    }

    #menu,
    #gameOver,
    #hud,
    #coinHud{
        visibility:hidden;
    }

}


/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        linear-gradient(
            #58c8e8,
            #b9f2ff
        );
}

#menu h1{
    font-size:
        clamp(45px,9vw,85px);

    color:white;

    text-shadow:
        4px 4px #333;

    margin-bottom:8px;
}

#menu p{
    color:#333;
    font-weight:bold;
    margin:5px;
}


/* =========================
   SKINS
========================= */

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;

    max-width:900px;

    padding:10px;
}

.skin{
    min-width:120px;

    border:3px solid white;
    border-radius:12px;

    background:#222;
    color:white;

    padding:10px;

    font-size:16px;
    font-weight:bold;
}

.skin.selected{
    border-color:#ffe600;

    box-shadow:
        0 0 15px #ffe600;
}

.skin.locked{
    opacity:.4;
}


/* =========================
   BOTÕES
========================= */

.mainButton{
    margin-top:12px;

    padding:14px 42px;

    border:0;
    border-radius:15px;

    background:#35b84a;

    color:white;

    font-size:24px;
    font-weight:bold;
}


/* =========================
   HUD
========================= */

#hud{
    position:fixed;

    z-index:5;

    top:12px;
    left:50%;

    transform:
        translateX(-50%);

    display:none;

    color:white;

    font:bold 28px Arial;

    text-shadow:
        3px 3px #333;
}

#coinHud{
    position:fixed;

    z-index:5;

    top:15px;
    left:18px;

    display:none;

    color:white;

    font:bold 20px Arial;

    text-shadow:
        2px 2px #333;
}


/* =========================
   GAME OVER
========================= */

#gameOver{
    position:fixed;

    inset:0;

    z-index:20;

    display:none;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        rgba(0,0,0,.55);

    color:white;
}

#gameOver h1{
    font-size:
        clamp(45px,8vw,75px);

    color:white;

    text-shadow:
        4px 4px #000;

    margin-bottom:15px;
}

#gameOver p{
    color:white;

    font-size:22px;

    margin:5px;
}

</style>
</head>


<body>


<canvas id="game"></canvas>


<!-- =========================
     TELA DE CELULAR EM PÉ
========================= -->

<div id="rotate">

    📱

    <br><br>

    Vire o celular de lado
    para jogar!

    <br><br>

    <b>SKY BIRD</b>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    Pontos:
    <span id="score">0</span>

</div>


<div id="coinHud">

    🪙
    <span id="coins">0</span>

</div>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <h1>
        🐦 SKY BIRD
    </h1>

    <p>
        Escolha seu pássaro
    </p>

    <p>

        🏆 Recorde:
        <span id="best">0</span>

        &nbsp;&nbsp;

        🪙
        <span id="bank">0</span>

    </p>

    <div id="skins"></div>

    <button
        class="mainButton"
        id="start">

        JOGAR

    </button>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">

    <h1>
        GAME OVER
    </h1>

    <p>

        Pontuação:
        <span id="finalScore">0</span>

    </p>

    <p>

        Recorde:
        <span id="finalBest">0</span>

    </p>

    <p>

        🪙 Moedas:
        <span id="finalCoins">0</span>

    </p>

    <button
        class="mainButton"
        id="restart">

        JOGAR NOVAMENTE

    </button>

    <button
        class="mainButton"
        id="menuButton">

        MENU

    </button>

</div>


<script>


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let W =
    window.innerWidth;

let H =
    window.innerHeight;


function resize(){

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =========================
   SKINS
========================= */

const skins = [

    {
        name:"🐦 Comum",
        unlock:0,
        color:"#ffd21f",
        wing:"#e4a900"
    },

    {
        name:"🦸 Herói",
        unlock:100,
        color:"#2878ff",
        wing:"#164da8"
    },

    {
        name:"🔥 Fênix",
        unlock:300,
        color:"#ff4b16",
        wing:"#c82c00"
    },

    {
        name:"🤖 Robô",
        unlock:500,
        color:"#9da5ad",
        wing:"#626970"
    },

    {
        name:"👽 Alien",
        unlock:1000,
        color:"#65ff50",
        wing:"#25a928"
    },

    {
        name:"🌑 Sombrio",
        unlock:2000,
        color:"#292333",
        wing:"#15111c"
    }

];


/* =========================
   SAVE
========================= */

let bestScore =
    Number(
        localStorage.getItem(
            "skyBest"
        ) || 0
    );


let totalCoins =
    Number(
        localStorage.getItem(
            "skyCoins"
        ) || 0
    );


let selectedSkin =
    Number(
        localStorage.getItem(
            "skySkin"
        ) || 0
    );


if(
    !skins[selectedSkin] ||
    bestScore <
    skins[selectedSkin].unlock
){

    selectedSkin = 0;

}


function saveData(){

    localStorage.setItem(
        "skyBest",
        bestScore
    );

    localStorage.setItem(
        "skyCoins",
        totalCoins
    );

    localStorage.setItem(
        "skySkin",
        selectedSkin
    );

}


/* =========================
   ELEMENTOS
========================= */

const menu =
    document.getElementById(
        "menu"
    );

const gameOver =
    document.getElementById(
        "gameOver"
    );

const hud =
    document.getElementById(
        "hud"
    );

const coinHud =
    document.getElementById(
        "coinHud"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const coinsText =
    document.getElementById(
        "coins"
    );


/* =========================
   MENU DE SKINS
========================= */

function createSkins(){

    const box =
        document.getElementById(
            "skins"
        );

    box.innerHTML = "";


    skins.forEach(
        (skin,index)=>{

            const button =
                document.createElement(
                    "button"
                );


            const unlocked =
                bestScore >=
                skin.unlock;


            button.className =
                "skin";


            if(
                index ===
                selectedSkin
            ){

                button.classList.add(
                    "selected"
                );

            }


            if(!unlocked){

                button.classList.add(
                    "locked"
                );

            }


            if(unlocked){

                button.textContent =
                    skin.name +
                    (
                        index > 0
                        ? " ✓"
                        : ""
                    );


                button.onclick =
                    function(){

                        selectedSkin =
                            index;

                        saveData();

                        createSkins();

                    };

            }
            else{

                button.textContent =
                    skin.name +
                    " 🔒 " +
                    skin.unlock;

            }


            box.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "best"
    ).textContent =
        bestScore;


    document.getElementById(
        "bank"
    ).textContent =
        totalCoins;

}


createSkins();


/* =========================
   OBJETOS DO JOGO
========================= */

let bird;

let clouds = [];

let fatalClouds = [];

let coins = [];

let particles = [];


let score = 0;

let runCoins = 0;

let playing = false;

let lastTime = 0;

let gameTime = 0;


let cloudTimer = 0;

let fatalTimer = 0;

let coinTimer = 0;


/* =========================
   RESET
========================= */

function resetGame(){

    bird = {

        x:
            W * 0.23,

        y:
            H * 0.45,

        velocity:0,

        radius:
            Math.max(
                22,
                Math.min(W,H)
                * 0.055
            ),

        rotation:0

    };


    clouds = [];

    fatalClouds = [];

    coins = [];

    particles = [];


    score = 0;

    runCoins = 0;

    gameTime = 0;


    cloudTimer = 0.2;

    fatalTimer = 2;

    coinTimer = 0.8;


    scoreText.textContent =
        "0";


    coinsText.textContent =
        "0";

}


/* =========================
   COMEÇAR
========================= */

function startGame(){

    resetGame();

    menu.style.display =
        "none";

    gameOver.style.display =
        "none";

    hud.style.display =
        "block";

    coinHud.style.display =
        "block";


    playing = true;

    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   PULO
========================= */

function flap(){

    if(!playing){

        return;

    }


    bird.velocity =
        -390;

    bird.rotation =
        -0.5;


    createParticles(
        bird.x - 10,
        bird.y + 10,
        5,
        "#ffffff"
    );

}


/* =========================
   CONTROLES
========================= */

canvas.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        flap();

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code === "Space" ||
            event.code === "ArrowUp"
        ){

            event.preventDefault();

            flap();

        }

    }
);


document.getElementById(
    "start"
).onclick =
    startGame;


document.getElementById(
    "restart"
).onclick =
    startGame;


document.getElementById(
    "menuButton"
).onclick =
    function(){

        playing = false;

        gameOver.style.display =
            "none";

        menu.style.display =
            "flex";

        createSkins();

        resetGame();

        draw();

    };


/* =========================
   PARTÍCULAS
========================= */

function createParticles(
    x,
    y,
    amount,
    color
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            velocityX:
                (
                    Math.random()
                    -0.5
                ) * 150,

            velocityY:
                (
                    Math.random()
                    -0.5
                ) * 150,

            life:
                0.4 +
                Math.random()
                * 0.4,

            color:color

        });

    }

}


/* =========================
   NUVEM NORMAL
========================= */

function createCloud(){

    clouds.push({

        x:
            W + 120,

        y:
            60 +
            Math.random()
            * H * 0.58,

        scale:
            0.7 +
            Math.random()
            * 0.6,

        speed:
            55 +
            Math.random()
            * 35

    });

}


/* =========================
   NUVEM FATAL
========================= */

function createFatalCloud(){

    fatalClouds.push({

        x:
            W + 120,

        y:
            80 +
            Math.random()
            * H * 0.55,

        scale:
            0.8 +
            Math.random()
            * 0.35,

        speed:
            90 +
            Math.random()
            * 40,

        phase:
            Math.random()
            * Math.PI * 2

    });

}


/* =========================
   MOEDA
========================= */

function createCoin(){

    coins.push({

        x:
            W + 50,

        y:
            80 +
            Math.random()
            * H * 0.62,

        radius:15,

        rotation:
            Math.random()
            * Math.PI * 2

    });

}


/* =========================
   ATUALIZAR
========================= */

function update(delta){

    delta =
        Math.min(
            delta,
            0.035
        );


    gameTime += delta;


    /* GRAVIDADE */

    bird.velocity +=
        1150 * delta;

    bird.y +=
        bird.velocity * delta;


    bird.rotation +=
        1.8 * delta;


    if(
        bird.rotation > 1
    ){

        bird.rotation = 1;

    }


    /* TIMERS */

    cloudTimer -= delta;

    fatalTimer -= delta;

    coinTimer -= delta;


    if(
        cloudTimer <= 0
    ){

        createCloud();

        cloudTimer =
            1 +
            Math.random()
            * 1.4;

    }


    if(
        coinTimer <= 0
    ){

        createCoin();

        coinTimer =
            0.75 +
            Math.random()
            * 1.1;

    }


    const difficulty =
        Math.min(
            2.2,
            1 +
            score / 30
        );


    if(
        fatalTimer <= 0
    ){

        createFatalCloud();

        fatalTimer =
            Math.max(
                1.3,
                2.8 /
                difficulty
            ) +
            Math.random()
            * 1.5;

    }


    /* =========================
       MOVIMENTO NUVENS
    ========================= */

    for(
        const cloud of clouds
    ){

        cloud.x -=
            cloud.speed *
            delta *
            difficulty;

    }


    for(
        const cloud of fatalClouds
    ){

        cloud.x -=
            cloud.speed *
            delta *
            difficulty;

        cloud.phase +=
            5 * delta;

    }


    /* =========================
       MOEDAS
    ========================= */

    for(
        const coin of coins
    ){

        coin.x -=
            190 *
            delta *
            difficulty;

        coin.rotation +=
            6 * delta;

    }


    /* =========================
       PEGAR MOEDAS
    ========================= */

    for(
        let i =
            coins.length - 1;
        i >= 0;
        i--
    ){

        const coin =
            coins[i];


        const distance =
            Math.hypot(
                bird.x -
                coin.x,

                bird.y -
                coin.y
            );


        if(
            distance <
            bird.radius +
            coin.radius
        ){

            runCoins++;


            coinsText.textContent =
                runCoins;


            createParticles(
                coin.x,
                coin.y,
                12,
                "#ffd21f"
            );


            coins.splice(
                i,
                1
            );

        }
        else if(
            coin.x < -60
        ){

            coins.splice(
                i,
                1
            );

        }

    }


    /* =========================
       NUVENS FATAIS
    ========================= */

    for(
        const cloud
        of fatalClouds
    ){

        const distance =
            Math.hypot(
                bird.x -
                cloud.x,

                bird.y -
                cloud.y
            );


        if(
            distance <
            bird.radius +
            42 *
            cloud.scale
        ){

            createParticles(
                bird.x,
                bird.y,
                25,
                "#ff3030"
            );

            endGame();

            return;

        }

    }


    /* LIMPEZA */

    clouds =
        clouds.filter(
            cloud =>
                cloud.x > -180
        );


    fatalClouds =
        fatalClouds.filter(
            cloud =>
                cloud.x > -180
        );


    /* =========================
       PARTÍCULAS
    ========================= */

    for(
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ){

        const particle =
            particles[i];


        particle.x +=
            particle.velocityX *
            delta;

        particle.y +=
            particle.velocityY *
            delta;

        particle.life -=
            delta;


        if(
            particle.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }


    /* =========================
       BORDA DA TELA
    ========================= */

    if(
        bird.y -
        bird.radius < 0
    ){

        endGame();

        return;

    }


    if(
        bird.y +
        bird.radius >
        H - 55
    ){

        endGame();

        return;

    }


    /* =========================
       PONTUAÇÃO
    ========================= */

    score =
        Math.floor(
            gameTime * 5
        );


    scoreText.textContent =
        score;

}


/* =========================
   DESENHAR NUVEM NORMAL
========================= */

function drawNormalCloud(
    cloud
){

    ctx.save();


    ctx.translate(
        cloud.x,
        cloud.y
    );


    ctx.scale(
        cloud.scale,
        cloud.scale
    );


    ctx.fillStyle =
        "rgba(255,255,255,.85)";


    ctx.beginPath();


    ctx.arc(
        -40,
        8,
        25,
        0,
        Math.PI * 2
    );


    ctx.arc(
        -12,
        -8,
        34,
        0,
        Math.PI * 2
    );


    ctx.arc(
        22,
        4,
        29,
        0,
        Math.PI * 2
    );


    ctx.arc(
        48,
        13,
        20,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================
   DESENHAR NUVEM FATAL
========================= */

function drawFatalCloud(
    cloud
){

    ctx.save();


    ctx.translate(
        cloud.x,
        cloud.y
    );


    ctx.scale(
        cloud.scale,
        cloud.scale
    );


    ctx.translate(
        0,
        Math.sin(
            cloud.phase
        ) * 3
    );


    /* NUVEM */

    ctx.fillStyle =
        "#555b66";

    ctx.strokeStyle =
        "#30343b";

    ctx.lineWidth = 5;


    ctx.beginPath();


    ctx.arc(
        -42,
        8,
        28,
        0,
        Math.PI * 2
    );


    ctx.arc(
        -15,
        -10,
        38,
        0,
        Math.PI * 2
    );


    ctx.arc(
        20,
        4,
        32,
        0,
        Math.PI * 2
    );


    ctx.arc(
        48,
        14,
        22,
        0,
        Math.PI * 2
    );


    ctx.fill();

    ctx.stroke();


    /* OLHOS */

    ctx.fillStyle =
        "#ff3030";


    ctx.beginPath();


    ctx.arc(
        -17,
        4,
        6,
        0,
        Math.PI * 2
    );


    ctx.arc(
        23,
        4,
        6,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* BOCA */

    ctx.strokeStyle =
        "#ff3030";

    ctx.lineWidth = 5;


    ctx.beginPath();


    ctx.moveTo(
        -22,
        22
    );


    ctx.quadraticCurveTo(
        2,
        38,
        28,
        21
    );


    ctx.stroke();


    ctx.restore();

}


/* =========================
   DESENHAR MOEDA
========================= */

function drawCoin(
    coin
){

    ctx.save();


    ctx.translate(
        coin.x,
        coin.y
    );


    const scale =
        Math.max(
            0.2,
            Math.abs(
                Math.cos(
                    coin.rotation
                )
            )
        );


    ctx.scale(
        scale,
        1
    );


    ctx.fillStyle =
        "#ffd21f";

    ctx.strokeStyle =
        "#c98b00";

    ctx.lineWidth = 3;


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        coin.radius,
        0,
        Math.PI * 2
    );


    ctx.fill();

    ctx.stroke();


    ctx.fillStyle =
        "#fff1a0";

    ctx.font =
        "bold 15px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "$",
        0,
        1
    );


    ctx.restore();

}


/* =========================
   DESENHAR PÁSSARO
========================= */

function drawBird(){

    const skin =
        skins[selectedSkin];


    const x =
        bird.x;

    const y =
        bird.y;

    const r =
        bird.radius;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        bird.rotation
    );


    /* FÊNIX */

    if(
        selectedSkin === 2
    ){

        ctx.fillStyle =
            "#ff7a00";


        ctx.beginPath();


        ctx.moveTo(
            -r * .5,
            r * .3
        );


        ctx.lineTo(
            -r * 1.8,
            r * 1.3
        );


        ctx.lineTo(
            -r * 1.1,
            0
        );


        ctx.lineTo(
            -r * 1.8,
            -r
        );


        ctx.lineTo(
            -r * .3,
            -r * .2
        );


        ctx.fill();

    }


    /* SOMBRIO */

    if(
        selectedSkin === 5
    ){

        ctx.shadowColor =
            "#8b55ff";

        ctx.shadowBlur =
            18;

    }


    /* CORPO */

    ctx.fillStyle =
        skin.color;


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.shadowBlur = 0;


    /* ASA */

    ctx.fillStyle =
        skin.wing;


    ctx.beginPath();


    ctx.ellipse(
        -r * .3,
        r * .35,
        r * .75,
        r * .38,
        -.3,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* HERÓI */

    if(
        selectedSkin === 1
    ){

        ctx.fillStyle =
            "#e21b23";


        ctx.beginPath();


        ctx.moveTo(
            -r * .2,
            r * .2
        );


        ctx.lineTo(
            -r * 1.7,
            r * 1.25
        );


        ctx.lineTo(
            -r * 1.05,
            0
        );


        ctx.fill();

    }


    /* ROBÔ */

    if(
        selectedSkin === 3
    ){

        ctx.strokeStyle =
            "#333";

        ctx.lineWidth = 3;


        ctx.strokeRect(
            -r * .65,
            -r * .65,
            r * 1.3,
            r * 1.3
        );


        ctx.fillStyle =
            "#ff3333";


        ctx.beginPath();


        ctx.arc(
            r * .35,
            -r * .2,
            r * .12,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }


    /* ALIEN */

    if(
        selectedSkin === 4
    ){

        ctx.fillStyle =
            "#111";


        ctx.beginPath();


        ctx.ellipse(
            r * .35,
            -r * .2,
            r * .22,
            r * .35,
            -.3,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }


    /* OLHO */

    ctx.fillStyle =
        "white";


    ctx.beginPath();


    ctx.arc(
        r * .45,
        -r * .3,
        r * .28,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "#111";


    ctx.beginPath();


    ctx.arc(
        r * .52,
        -r * .3,
        r * .12,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* BICO */

    ctx.fillStyle =
        "#ff8c00";


    ctx.beginPath();


    ctx.moveTo(
        r * .75,
        0
    );


    ctx.lineTo(
        r * 1.55,
        r * .2
    );


    ctx.lineTo(
        r * .75,
        r * .4
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();

}


/* =========================
   DESENHAR FUNDO
========================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#58cce9"
    );


    gradient.addColorStop(
        1,
        "#c1f4ff"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SOL */

    ctx.fillStyle =
        "#ffe46b";


    ctx.beginPath();


    ctx.arc(
        W * .82,
        H * .16,
        38,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* MONTANHAS */

    ctx.fillStyle =
        "#72b9c8";


    ctx.beginPath();


    ctx.moveTo(
        0,
        H - 55
    );


    ctx.lineTo(
        W * .15,
        H * .48
    );


    ctx.lineTo(
        W * .30,
        H - 55
    );


    ctx.lineTo(
        W * .45,
        H * .50
    );


    ctx.lineTo(
        W * .62,
        H - 55
    );


    ctx.lineTo(
        W * .78,
        H * .46
    );


    ctx.lineTo(
        W,
        H - 55
    );


    ctx.closePath();


    ctx.fill();


    /* CHÃO */

    ctx.fillStyle =
        "#72c94b";


    ctx.fillRect(
        0,
        H - 55,
        W,
        55
    );


    ctx.fillStyle =
        "#d9bd63";


    ctx.fillRect(
        0,
        H - 55,
        W,
        8
    );

}


/* =========================
   DESENHAR
========================= */

function draw(){

    drawBackground();


    for(
        const cloud
        of clouds
    ){

        drawNormalCloud(
            cloud
        );

    }


    for(
        const cloud
        of fatalClouds
    ){

        drawFatalCloud(
            cloud
        );

    }


    for(
        const coin
        of coins
    ){

        drawCoin(
            coin
        );

    }


    for(
        const particle
        of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life * 2
            );


        ctx.fillStyle =
            particle.color;


        ctx.fillRect(
            particle.x,
            particle.y,
            5,
            5
        );

    }


    ctx.globalAlpha = 1;


    drawBird();

}


/* =========================
   LOOP
========================= */

function gameLoop(now){

    if(!playing){

        return;

    }


    const delta =
        (now - lastTime)
        / 1000;


    lastTime = now;


    update(delta);

    draw();


    if(playing){

        requestAnimationFrame(
            gameLoop
        );

    }

}


/* =========================
   INÍCIO
========================= */

resetGame();

draw();

</script>
