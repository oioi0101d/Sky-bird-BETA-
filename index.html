<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Sky Bird</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: manipulation;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #70c5ce;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: linear-gradient(#58c8e8, #b9f2ff);
}

#menu h1 {
    font-size: clamp(40px, 9vw, 80px);
    color: white;
    text-shadow: 4px 4px #333;
    margin-bottom: 10px;
}

#menu p {
    color: #333;
    font-weight: bold;
    margin-bottom: 20px;
}

#skins {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 900px;
    padding: 10px;
}

.skin {
    border: 3px solid white;
    border-radius: 12px;
    background: #222;
    color: white;
    padding: 10px 14px;
    font-size: 18px;
    cursor: pointer;
}

.skin.locked {
    opacity: 0.45;
}

.skin.selected {
    border-color: #ffe600;
    box-shadow: 0 0 12px #ffe600;
}

#start {
    margin-top: 15px;
    padding: 14px 45px;
    border: 0;
    border-radius: 15px;

    background: #35b84a;
    color: white;

    font-size: 25px;
    font-weight: bold;
}

#score {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 5;

    color: white;
    font-size: clamp(35px, 7vw, 65px);
    font-weight: bold;

    text-shadow: 4px 4px #333;

    display: none;
}

#gameOver {
    position: fixed;
    inset: 0;

    z-index: 20;

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.55);
    color: white;
}

#gameOver h2 {
    font-size: 55px;
    text-shadow: 4px 4px #000;
}

#gameOver p {
    font-size: 25px;
    margin: 10px;
}

#restart {
    padding: 13px 35px;
    border: 0;
    border-radius: 12px;

    background: #35b84a;
    color: white;

    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="score">0</div>

<!-- MENU -->
<div id="menu">

    <h1>🐦 SKY BIRD</h1>

    <p>Escolha seu pássaro</p>

    <div id="skins"></div>

    <button id="start">
        JOGAR
    </button>

</div>

<!-- GAME OVER -->
<div id="gameOver">

    <h2>GAME OVER</h2>

    <p>
        Pontuação:
        <span id="finalScore">0</span>
    </p>

    <button id="restart">
        JOGAR NOVAMENTE
    </button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const scoreText = document.getElementById("score");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

const skins = [

    {
        name: "🐦 Comum",
        unlock: 0,
        color: "#ffd21f"
    },

    {
        name: "🦸 Herói",
        unlock: 100,
        color: "#2878ff"
    },

    {
        name: "🔥 Fênix",
        unlock: 300,
        color: "#ff4b16"
    },

    {
        name: "🤖 Robô",
        unlock: 500,
        color: "#9da5ad"
    },

    {
        name: "👽 Alien",
        unlock: 1000,
        color: "#65ff50"
    },

    {
        name: "🌑 Sombrio",
        unlock: 2000,
        color: "#292333"
    }

];

let bestScore =
    Number(localStorage.getItem("skyBest") || 0);

let selectedSkin =
    Number(localStorage.getItem("skySkin") || 0);

let W;
let H;

function resize() {

    W = canvas.width =
        window.innerWidth;

    H = canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);
