<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SKY BIRD</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:manipulation;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#70c5ce;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:auto;
    padding:15px;
    background:linear-gradient(#58c8e8,#b9f2ff);
}

#menu h1{
    color:white;
    font-size:clamp(42px,9vw,80px);
    text-shadow:4px 4px #333;
    margin-bottom:5px;
}

#menu p{
    color:#333;
    font-weight:bold;
    margin:4px;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px;
    width:min(900px,95vw);
    margin:10px 0;
}

.skin{
    min-width:125px;
    padding:10px 12px;
    border:3px solid white;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.skin.selected{
    border-color:#ffe600;
    box-shadow:0 0 15px #ffe600;
}

.skin.locked{
    opacity:.45;
}

.button{
    margin-top:10px;
    padding:14px 42px;
    border:0;
    border-radius:15px;
    background:#35b84a;
    color:white;
    font-size:24px;
    font-weight:bold;
}

#score{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    display:none;
    color:white;
    font-size:55px;
    font-weight:bold;
    text-shadow:4px 4px #333;
}

#coinHud{
    position:fixed;
    top:18px;
    left:20px;
    z-index:5;
    display:none;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:3px 3px #333;
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.6);
    color:white;
    text-align:center;
}

#gameOver h2{
    font-size:clamp(45px,8vw,70px);
    text-shadow:4px 4px #000;
}

#gameOver p{
    font-size:22px;
    margin:6px;
}
</style></head><body><canvas id="game"></canvas>

<div id="score">0</div><div id="coinHud">
    🪙 <span id="coins">0</span>
</div><div id="menu"><h1>🐦 SKY BIRD</h1>

<p>Escolha seu pássaro</p>

<p>
    🏆 Recorde:
    <span id="best">0</span>
    &nbsp;&nbsp;
    🪙:
    <span id="totalCoins">0</span>
</p>

<div id="skins"></div>

<button class="button" id="start">
    JOGAR
</button>

</div><div id="gameOver"><h2>GAME OVER</h2>

<p>
    Pontuação:
    <span id="finalScore">0</span>
</p>

<p>
    Recorde:
    <span id="finalBest">0</span>
</p>

<p>
    🪙 Moedas:
    <span id="finalCoins">0</span>
</p>

<button class="button" id="restart">
    JOGAR NOVAMENTE
</button>

<button class="button" id="backMenu">
    MENU
</button>

</div><script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0;

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);


/* =========================
   SKINS
========================= */

const skins=[

{
    name:"🐦 Comum",
    unlock:0,
    body:"#ffd21f",
    wing:"#e5aa00",
    head:"none"
},

{
    name:"🦸 Herói",
    unlock:10,
    body:"#2878ff",
    wing:"#1652b5",
    head:"hero"
},

{
    name:"🔥 Fênix",
    unlock:30,
    body:"#ff4b16",
    wing:"#c83200",
    head:"fire"
},

{
    name:"🤖 Robô",
    unlock:50,
    body:"#9da5ad",
    wing:"#626970",
    head:"robot"
},

{
    name:"👽 Alien",
    unlock:100,
    body:"#65ff50",
    wing:"#269e28",
    head:"alien"
},

{
    name:"🌑 Sombrio",
    unlock:200,
    body:"#292333",
    wing:"#15111c",
    head:"dark"
},

{
    name:"🍩 Rosquinha",
    unlock:300,
    body:"#ffcf91",
    wing:"#d88b45",
    head:"donut"
},

{
    name:"🧇 Waffle",
    unlock:500,
    body:"#f5c45b",
    wing:"#bd8024",
    head:"waffle"
}

];

let bestScore=Number(localStorage.getItem("skyBest")||0);
let totalCoins=Number(localStorage.getItem("skyCoins")||0);
let selectedSkin=Number(localStorage.getItem("skySkin")||0);

if(!skins[selectedSkin] || bestScore<skins[selectedSkin].unlock){
    selectedSkin=0;
}


/* =========================
   MENU DAS SKINS
========================= */

function createSkins(){

    const box=document.getElementById("skins");

    box.innerHTML="";

    skins.forEach((skin,index)=>{

        const button=document.createElement("button");

        button.className="skin";

        const unlocked=bestScore>=skin.unlock;

        if(index===selectedSkin){
            button.classList.add("selected");
        }

        if(!unlocked){
            button.classList.add("locked");
            button.textContent=
                skin.name+" 🔒 "+skin.unlock;
        }
        else{

            button.textContent=
                skin.name+
                (skin.unlock>0 ? " ✓":"");

            button.onclick=()=>{

                selectedSkin=index;

                localStorage.setItem(
                    "skySkin",
                    selectedSkin
                );

                createSkins();
                draw();

            };
        }

        box.appendChild(button);

    });

    document.getElementById("best").textContent=bestScore;
    document.getElementById("totalCoins").textContent=totalCoins;
}

createSkins();


/* =========================
   JOGO
========================= */

let bird={
    x:0,
    y:0,
    velocity:0,
    radius:28,
    rotation:0
};

let fatalClouds=[];
let coins=[];
let particles=[];

let score=0;
let runCoins=0;
let playing=false;
let lastTime=0;
let gameTime=0;

let fatalTimer=2;
let coinTimer=1;


/* =========================
   RESET
========================= */

function resetGame(){

    bird.x=W*.25;
    bird.y=H*.45;
    bird.velocity=0;
    bird.radius=Math.max(22,Math.min(W,H)*.055);
    bird.rotation=0;

    fatalClouds=[];
    coins=[];
    particles=[];

    score=0;
    runCoins=0;
    gameTime=0;

    fatalTimer=1.5;
    coinTimer=.7;

    document.getElementById("score").textContent="0";
    document.getElementById("coins").textContent="0";
}


/* =========================
   COMEÇAR
========================= */

function startGame(){

    resetGame();

    document.getElementById("menu").style.display="none";
    document.getElementById("gameOver").style.display="none";
    document.getElementById("score").style.display="block";
    document.getElementById("coinHud").style.display="block";

    playing=true;
    lastTime=performance.now();

    requestAnimationFrame(gameLoop);
}


/* =========================
   PULO
========================= */

function flap(){

    if(!playing)return;

    bird.velocity=-390;
    bird.rotation=-.5;
}

canvas.addEventListener("pointerdown",e=>{
    e.preventDefault();
    flap();
});

document.addEventListener("keydown",e=>{

    if(e.code==="Space"||e.code==="ArrowUp"){
        e.preventDefault();
        flap();
    }

});

document.getElementById("start").onclick=startGame;
document.getElementById("restart").onclick=startGame;

document.getElementById("backMenu").onclick=()=>{

    playing=false;

    document.getElementById("gameOver").style.display="none";
    document.getElementById("menu").style.display="flex";
    document.getElementById("score").style.display="none";
    document.getElementById("coinHud").style.display="none";

    createSkins();
    resetGame();
    draw();
};


/* =========================
   NUVEM FATAL
========================= */

function createFatalCloud(){

    fatalClouds.push({

        x:W+100,

        y:70+Math.random()*(H*.65),

        size:38+Math.random()*15,

        speed:95+Math.random()*45,

        pulse:Math.random()*10

    });
}


/* =========================
   MOEDA
========================= */

function createCoin(){

    coins.push({

        x:W+40,

        y:70+Math.random()*(H*.65),

        radius:15,

        spin:Math.random()*6

    });
}


/* =========================
   PARTÍCULAS
========================= */

function particlesAt(x,y,color){

    for(let i=0;i<12;i++){

        particles.push({

            x:x,
            y:y,
            vx:(Math.random()-.5)*180,
            vy:(Math.random()-.5)*180,
            life:.5,
            color:color

        });
    }
}


/* =========================
   ATUALIZAR
========================= */

function update(delta){

    delta=Math.min(delta,.035);

    gameTime+=delta;

    bird.velocity+=1150*delta;
    bird.y+=bird.velocity*delta;

    bird.rotation+=2*delta;

    bird.rotation=Math.min(1,bird.rotation);


    fatalTimer-=delta;
    coinTimer-=delta;


    if(fatalTimer<=0){

        createFatalCloud();

        fatalTimer=
            1.8+
            Math.random()*1.7;
    }


    if(coinTimer<=0){

        createCoin();

        coinTimer=
            .7+
            Math.random()*1.1;
    }


    const speed=
        1+
        Math.min(1.6,score/150);


    for(const cloud of fatalClouds){

        cloud.x-=
            cloud.speed*
            delta*
            speed;

        cloud.pulse+=delta*5;

    }


    for(const coin of coins){

        coin.x-=
            190*
            delta*
            speed;

        coin.spin+=delta*7;

    }


    /* MOEDAS */

    for(let i=coins.length-1;i>=0;i--){

        const coin=coins[i];

        const d=Math.hypot(
            bird.x-coin.x,
            bird.y-coin.y
        );

        if(d<bird.radius+coin.radius){

            runCoins++;

            document.getElementById("coins").textContent=runCoins;

            particlesAt(
                coin.x,
                coin.y,
                "#ffe600"
            );

            coins.splice(i,1);

        }
        else if(coin.x<-50){

            coins.splice(i,1);

        }
    }


    /* NUVENS FATAIS */

    for(const cloud of fatalClouds){

        const d=Math.hypot(
            bird.x-cloud.x,
            bird.y-cloud.y
        );

        if(
            d<
            bird.radius+
            cloud.size*.75
        ){

            particlesAt(
                bird.x,
                bird.y,
                "#ff3333"
            );

            endGame();
            return;
        }

    }


    fatalClouds=
        fatalClouds.filter(
            c=>c.x>-150
        );


    /* PARTÍCULAS */

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx*delta;
        p.y+=p.vy*delta;
        p.life-=delta;

        if(p.life<=0){
            particles.splice(i,1);
        }

    }


    /* CHÃO E TETO */

    if(
        bird.y-bird.radius<0 ||
        bird.y+bird.radius>H-45
    ){

        endGame();
        return;
    }


    score=Math.floor(gameTime*5);

    document.getElementById("score").textContent=score;
}


/* =========================
   FUNDO
========================= */

function drawBackground(){

    const g=ctx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,"#58c8e8");
    g.addColorStop(1,"#b9f2ff");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);


    /* SOL */

    ctx.fillStyle="#ffe36b";

    ctx.beginPath();

    ctx.arc(
        W*.82,
        H*.15,
        40,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* CHÃO */

    ctx.fillStyle="#79c94a";
    ctx.fillRect(0,H-45,W,45);

    ctx.fillStyle="#5da538";
    ctx.fillRect(0,H-45,W,6);
}


/* =========================
   NUVEM FATAL
========================= */

function drawFatalCloud(cloud){

    ctx.save();

    ctx.translate(
        cloud.x,
        cloud.y+
        Math.sin(cloud.pulse)*3
    );

    ctx.shadowColor="#ff2222";
    ctx.shadowBlur=16;

    ctx.fillStyle="#555563";
    ctx.strokeStyle="#292933";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(-40,8,cloud.size*.65,0,Math.PI*2);
    ctx.arc(-10,-10,cloud.size*.9,0,Math.PI*2);
    ctx.arc(25,4,cloud.size*.75,0,Math.PI*2);
    ctx.arc(48,12,cloud.size*.5,0,Math.PI*2);

    ctx.fill();
    ctx.stroke();

    ctx.shadowBlur=0;

    /* OLHOS */

    ctx.fillStyle="#ff3333";

    ctx.beginPath();

    ctx.arc(-17,2,6,0,Math.PI*2);
    ctx.arc(23,2,6,0,Math.PI*2);

    ctx.fill();

    /* BOCA */

    ctx.strokeStyle="#ff3333";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(-22,22);
    ctx.quadraticCurveTo(2,37,27,21);

    ctx.stroke();

    ctx.restore();
}


/* =========================
   MOEDA
========================= */

function drawCoin(coin){

    ctx.save();

    ctx.translate(coin.x,coin.y);

    const s=Math.max(
        .25,
        Math.abs(Math.cos(coin.spin))
    );

    ctx.scale(s,1);

    ctx.fillStyle="#ffd21f";
    ctx.strokeStyle="#b57b00";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(0,0,coin.radius,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#fff3a0";
    ctx.font="bold 15px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("★",0,1);

    ctx.restore();
}


/* =========================
   PÁSSARO
========================= */

function drawBird(){

    const skin=skins[selectedSkin];
    const r=bird.radius;

    ctx.save();

    ctx.translate(bird.x,bird.y);
    ctx.rotate(bird.rotation);

    /* SOMBRIO */

    if(skin.head==="dark"){

        ctx.shadowColor="#9a55ff";
        ctx.shadowBlur=20;
    }


    /* CORPO */

    ctx.fillStyle=skin.body;

    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;


    /* ASA */

    ctx.fillStyle=skin.wing;

    ctx.beginPath();

    ctx.ellipse(
        -r*.3,
        r*.35,
        r*.75,
        r*.38,
        -.3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* =================
       ROSQUINHA
    ================= */

    if(skin.head==="donut"){

        ctx.fillStyle="#d88b45";

        ctx.beginPath();
        ctx.arc(0,-r*.9,r*.58,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#ff9fc4";

        ctx.beginPath();
        ctx.arc(0,-r*.9,r*.46,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#ffcf91";

        ctx.beginPath();
        ctx.arc(0,-r*.9,r*.17,0,Math.PI*2);
        ctx.fill();

        /* granulado */

        ctx.fillStyle="#7b42ff";

        for(let i=0;i<6;i++){

            const a=i*Math.PI/3;

            ctx.fillRect(
                Math.cos(a)*r*.38-2,
                -r*.9+Math.sin(a)*r*.38-2,
                4,
                4
            );
        }
    }


    /* =================
       WAFFLE
    ================= */

    if(skin.head==="waffle"){

        ctx.save();

        ctx.translate(0,-r*.95);
        ctx.rotate(-.08);

        ctx.fillStyle="#e7ad42";
        ctx.strokeStyle="#9b681d";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.roundRect(
            -r*.65,
            -r*.45,
            r*1.3,
            r*.9,
            8
        );

        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle="#b77c25";
        ctx.lineWidth=3;

        for(let i=-2;i<=2;i++){

            ctx.beginPath();

            ctx.moveTo(
                -r*.5+i*r*.25,
                -r*.4
            );

            ctx.lineTo(
                -r*.1+i*r*.25,
                r*.4
            );

            ctx.stroke();

        }

        for(let i=-2;i<=2;i++){

            ctx.beginPath();

            ctx.moveTo(
                -r*.6,
                i*r*.2
            );

            ctx.lineTo(
                r*.6,
                i*r*.2
            );

            ctx.stroke();

        }

        ctx.restore();
    }


    /* HERÓI */

    if(skin.head==="hero"){

        ctx.fillStyle="#e21b23";

        ctx.beginPath();

        ctx.moveTo(-r*.2,r*.2);
        ctx.lineTo(-r*1.6,r*1.2);
        ctx.lineTo(-r,0);

        ctx.fill();
    }


    /* FÊNIX */

    if(skin.head==="fire"){

        ctx.fillStyle="#ff9d00";

        ctx.beginPath();

        ctx.moveTo(-r*.5,-r*.4);
        ctx.lineTo(-r*1.3,-r*1.5);
        ctx.lineTo(-r*.3,-r*.9);
        ctx.lineTo(0,-r*1.6);
        ctx.lineTo(r*.2,-r*.5);

        ctx.fill();
    }


    /* ROBÔ */

    if(skin.head==="robot"){

        ctx.strokeStyle="#333";
        ctx.lineWidth=3;

        ctx.strokeRect(
            -r*.65,
            -r*.65,
            r*1.3,
            r*1.3
        );

        ctx.fillStyle="#ff3333";

        ctx.beginPath();
        ctx.arc(r*.35,-r*.2,r*.12,0,Math.PI*2);
        ctx.fill();
    }


    /* ALIEN */

    if(skin.head==="alien"){

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.ellipse(
            r*.35,
            -r*.2,
            r*.22,
            r*.35,
            -.3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* OLHO */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        r*.45,
        -r*.3,
        r*.28,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        r*.52,
        -r*.3,
        r*.12,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BICO */

    ctx.fillStyle="#ff8c00";

    ctx.beginPath();

    ctx.moveTo(r*.75,0);
    ctx.lineTo(r*1.55,r*.2);
    ctx.lineTo(r*.75,r*.4);

    ctx.closePath();
    ctx.fill();

    ctx.restore();
}


/* =========================
   DESENHAR
========================= */

function draw(){

    drawBackground();

    for(const cloud of fatalClouds){
        drawFatalCloud(cloud);
    }

    for(const coin of coins){
        drawCoin(coin);
    }

    for(const p of particles){

        ctx.globalAlpha=Math.max(0,p.life*2);
        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );
    }

    ctx.globalAlpha=1;

    drawBird();
}


/* =========================
   LOOP
========================= */

function gameLoop(now){

    if(!playing)return;

    const delta=
        (now-lastTime)/1000;

    lastTime=now;

    update(delta);
    draw();

    if(playing){
        requestAnimationFrame(gameLoop);
    }
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    if(!playing)return;

    playing=false;

    if(score>bestScore){
        bestScore=score;
    }

    totalCoins+=runCoins;

    localStorage.setItem(
        "skyBest",
        bestScore
    );

    localStorage.setItem(
        "skyCoins",
        totalCoins
    );

    document.getElementById("finalScore").textContent=score;
    document.getElementById("finalBest").textContent=bestScore;
    document.getElementById("finalCoins").textContent=runCoins;

    document.getElementById("score").style.display="none";
    document.getElementById("coinHud").style.display="none";
    document.getElementById("gameOver").style.display="flex";

    createSkins();
}


/* =========================
   INÍCIO
========================= */

resetGame();
draw();

</script></body>
</html>
